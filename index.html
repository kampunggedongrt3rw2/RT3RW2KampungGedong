<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sistem Administrasi Warga</title>
<style>
    :root {
      --primary-color: #0d6efd;
      --primary-hover: #0b5ed7;
      --secondary-color: #0f172a;
      --light-bg: #f4f7fc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --sidebar-width: 260px;
      --text-main: #334155;
    }

    #settingsTarifTahunSelect {
      min-width: 115px !important;
      width: 115px !important;
      padding-left: 12px !important;
      padding-right: 34px !important;
      font-size: 0.88rem !important;
      font-weight: 700 !important;
      color: #0d6efd !important;
      border: 1px solid #cbd5e1 !important;
      border-radius: 8px !important;
      background-color: #ffffff !important;
      cursor: pointer;
    }
    
    .stat-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05) !important;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--light-bg);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* Landing Page Specific Style (landingpage.png) */
    .landing-navbar {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      transition: all 0.3s ease;
    }
    .nav-link-landing {
      font-weight: 500;
      color: #64748b !important;
      transition: color 0.2s ease;
    }
    .nav-link-landing:hover, .nav-link-landing.active {
      color: var(--primary-color) !important;
    }
    .nav-link-landing.active {
      border-bottom: 2px solid var(--primary-color);
    }
    
    .hero-title {
      font-size: 2.75rem;
      font-weight: 800;
      line-height: 1.25;
      color: var(--secondary-color);
    }
    .hero-title span {
      color: var(--primary-color);
    }
    
    /* Custom Card Style to replicate landingpage.png */
    .landing-card {
      background: var(--card-bg);
      border: 1px solid rgba(226, 232, 240, 0.8);
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.02);
      margin-bottom: 1.5rem;
    }
    .landing-card-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: none;
    }
    
    /* Date Badge components */
    .date-badge {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #eff6ff;
      color: var(--primary-color);
    }
    .date-badge-day {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1;
    }
    .date-badge-month {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    
    /* Quick Services Buttons Grid */
    .service-grid-btn {
      background: #f8fafc;
      border: 1px solid #f1f5f9;
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .service-grid-btn:hover {
      background: #ffffff;
      box-shadow: 0 8px 16px rgba(15, 23, 42, 0.05);
      border-color: var(--primary-color);
      transform: translateY(-2px);
    }
    
    /* Premium Banner "Ayo Berpartisipasi!" */
    .cta-banner {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border-radius: 16px;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }
    .cursor-pointer {
      cursor: pointer;
    }
    .hover-bg-light:hover {
      background-color: #f8fafc;
    }

    /* Premium Login Style */
    .login-card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
    }
    
    /* Sidebar Layout styles */
    .sidebar {
      width: var(--sidebar-width);
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      background-color: var(--secondary-color);
      z-index: 1000;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    .sidebar-brand {
      padding: 1.5rem;
      color: #fff;
      font-weight: 700;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar-menu {
      padding: 1rem 0;
      flex-grow: 1;
      overflow-y: auto;
    }
    .nav-item-custom {
      padding: 0.75rem 1.5rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s;
      border-left: 4px solid transparent;
      cursor: pointer;
    }
    .nav-item-custom:hover {
      background-color: rgba(255,255,255,0.04);
      color: #fff;
    }
    .nav-item-custom.active {
      background-color: rgba(255,255,255,0.08);
      color: #fff;
      border-left-color: var(--primary-color);
    }
    
    .main-content {
      margin-left: var(--sidebar-width);
      min-height: 100vh;
      transition: all 0.3s ease;
    }
    .main-header {
      background-color: #fff;
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 99;
    }

    /* === NOTIFICATION BELL === */
    #notifBellContainer { position: relative; }
    .notif-bell-btn {
      background: none;
      border: none;
      padding: 8px 10px;
      border-radius: 10px;
      color: #495057;
      transition: all 0.2s ease;
      cursor: pointer;
      position: relative;
    }
    .notif-bell-btn:hover {
      background: var(--bg-light, #f0f2f5);
      color: var(--primary-color, #4361ee);
      transform: scale(1.05);
    }
    .notif-bell-btn .notif-badge {
      position: absolute;
      top: 2px;
      right: 2px;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      box-shadow: 0 2px 6px rgba(239,68,68,0.4);
      animation: notifPulse 2s ease-in-out infinite;
    }
    @keyframes notifPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    .notif-panel {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 380px;
      max-height: 460px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.04);
      z-index: 1000;
      overflow: hidden;
      animation: notifSlideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes notifSlideIn {
      from { opacity: 0; transform: translateY(-8px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .notif-panel-header {
      padding: 16px 20px 12px;
      font-weight: 700;
      font-size: 1rem;
      color: #1a1a2e;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .notif-panel-header .notif-count-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, var(--primary-color, #4361ee), #6c63ff);
      padding: 2px 10px;
      border-radius: 20px;
    }
    .notif-panel-body {
      max-height: 380px;
      overflow-y: auto;
      padding: 8px;
    }
    .notif-panel-body::-webkit-scrollbar { width: 4px; }
    .notif-panel-body::-webkit-scrollbar-track { background: transparent; }
    .notif-panel-body::-webkit-scrollbar-thumb { background: #d0d0d0; border-radius: 4px; }
    .notif-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
      color: inherit;
    }
    .notif-item:hover {
      background: #f4f6fb;
      transform: translateX(2px);
    }
    .notif-item-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }
    .notif-item-icon.pemasukan { background: #dcfce7; color: #16a34a; }
    .notif-item-icon.pengeluaran { background: #fee2e2; color: #dc2626; }
    .notif-item-icon.surat { background: #dbeafe; color: #2563eb; }
    .notif-item-icon.aduan { background: #fff7ed; color: #ea580c; }
    .notif-item-icon.peminjaman { background: #f3e8ff; color: #9333ea; }
    .notif-item-body { flex: 1; min-width: 0; }
    .notif-item-title {
      font-weight: 600;
      font-size: 0.82rem;
      color: #1a1a2e;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .notif-item-desc {
      font-size: 0.75rem;
      color: #6b7280;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .notif-item-time {
      font-size: 0.65rem;
      color: #9ca3af;
      margin-top: 3px;
    }
    .notif-empty {
      text-align: center;
      padding: 40px 20px;
      color: #9ca3af;
    }
    .notif-empty i {
      font-size: 2.5rem;
      margin-bottom: 12px;
      display: block;
      opacity: 0.5;
    }
    @media (max-width: 480px) {
      .notif-panel {
        width: calc(100vw - 24px);
        right: -60px;
      }
    }
    /* === END NOTIFICATION BELL === */

    .content-body {
      padding: 1.5rem;
    }
    
    .stat-card {
      border: none;
      border-radius: 12px;
      transition: transform 0.2s;
    }
    .stat-card:hover {
      transform: translateY(-2px);
    }
    
    @media (max-width: 991.98px) {
      .sidebar {
        left: calc(-1 * var(--sidebar-width));
      }
      .sidebar.active {
        left: 0;
      }
      .main-content {
        margin-left: 0;
      }
      .sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 999;
      }
      .sidebar-overlay.active {
        display: block;
      }
    }
    
    .opacity-60 {
      opacity: 0.6;
      pointer-events: none;
    }
    .cursor-pointer {
      cursor: pointer;
    }
    .table-responsive {
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #fff;
    }
    
    /* Custom Checklist styles */
    .ceklist-checkbox {
      width: 24px;
      height: 24px;
      cursor: pointer;
      appearance: none;
      border: 2px solid #cbd5e1;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.2s ease;
      background-color: #fff;
    }
    .ceklist-checkbox:checked {
      background-color: #10b981;
      border-color: #10b981;
    }
    .ceklist-checkbox:checked::after {
      content: "\f00c";
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      color: #fff;
      font-size: 11px;
      position: absolute;
    }
    .ceklist-checkbox:hover {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }
    .ceklist-checkbox:disabled {
      opacity: 0.5;
      pointer-events: none;
    }
    
    .checkbox-loading {
      width: 20px;
      height: 20px;
      border: 2px solid #cbd5e1;
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spinCheckbox 0.6s linear infinite;
      display: inline-block;
    }
    @keyframes spinCheckbox {
      to { transform: rotate(360deg); }
    }
    
    .text-total-iuran {
      font-size: 0.85rem;
      line-height: 1.2;
    }
    
    /* Snappy Modals Performance Tweak */
    .modal.fade .modal-dialog {
      transition: transform 0.08s ease-out !important;
    }
    .modal.fade {
      transition: opacity 0.05s linear !important;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbycJbAF40ZWFzWJSzq4JD1-VgVi4G_WGdd6HZtcIF7XZ2b8LyTND6nluIhBXcevv1XNyg/exec"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation;">
    </iframe>
  </div>
</body>
</html>
